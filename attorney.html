<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Attorney Profile | HCCW</title>
  <link rel="icon" href="assets/img/favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body data-page="attorneys">

<main id="main">
  <section class="profile-hero">
    <div class="container">
      <nav class="crumbs fade-up" aria-label="Breadcrumb"><a href="index.html">Home</a><i data-icon="chevronRight"></i><a href="attorneys.html">Attorneys</a><i data-icon="chevronRight"></i><span id="crumbName"></span></nav>
      <div class="profile-top">
        <div class="profile-photo fade-up d1"><img id="photo" src="" alt=""></div>
        <div class="profile-info">
          <h1 class="fade-up d1" id="name"></h1>
          <div class="ptitle fade-up d2" id="ptitle"></div>
          <p class="plede fade-up d2" id="lede"></p>
          <div class="profile-actions fade-up d3" id="actions"></div>
        </div>
      </div>
    </div>
  </section>

  <div class="container">
    <div class="profile-body">
      <aside class="profile-aside">
        <div class="side-card reveal" id="contactCard"><h4><i data-icon="card"></i> Contact</h4><div id="contactRows"></div></div>
        <div class="side-card reveal" style="--d:.08s" id="areasCard"><h4><i data-icon="briefcase"></i> Practice Areas</h4><div class="tag-list" id="areaTags"></div></div>
        <div class="side-card reveal" style="--d:.16s"><h4><i data-icon="scale"></i> Bar Admissions</h4><div class="tag-list" id="barTags"></div></div>
      </aside>
      <div>
        <div class="reveal">
          <span class="eyebrow">Biography</span>
          <div class="prose" id="bio"></div>
        </div>
        <div class="profile-tabs reveal" id="tabs" role="tablist"></div>
        <div id="panels"></div>
      </div>
    </div>
  </div>

  <section class="section bg-ivory">
    <div class="container">
      <div class="section-head reveal" style="display:flex;justify-content:space-between;align-items:flex-end;gap:30px;max-width:none;flex-wrap:wrap">
        <div><span class="eyebrow" id="colEyebrow">Colleagues</span><h2 style="margin:0" id="colTitle">More attorneys</h2></div>
        <a class="btn btn-outline" id="colLink" href="attorneys.html">View all <i data-icon="arrow" class="icon-arrow"></i></a>
      </div>
      <div class="atty-grid" id="colleagues" data-stagger=".08"></div>
    </div>
  </section>
</main>

<script src="assets/js/data-generated.js"></script>
<script src="assets/js/data.js"></script>
<script src="assets/js/cards.js"></script>
<script>
  (function () {
    const H = window.HCCW;
    const $ = (id) => document.getElementById(id);
    const slug = new URLSearchParams(location.search).get('a') || 'benjamin-p-abel';
    const a = H.attorneys.find((x) => x.slug === slug) || H.attorneys[0];
    const pr = H.profiles[a.slug];
    const office = H.offices.find((o) => o.filter === a.loc);
    const ico = (n) => `<i data-icon="${n}"></i>`;

    document.title = `${a.name} | ${a.title} | HCCW`;
    $('crumbName').textContent = a.name;
    $('name').textContent = a.name;
    $('photo').src = pr ? pr.photo : `assets/img/attorneys/${a.slug}.jpg`;
    $('photo').alt = a.name;
    $('ptitle').innerHTML = `<span class="pill">${a.title}</span>` + (office ? `<a href="locations.html#${office.id}">${ico('pin')} ${office.city} Office</a>` : '');

    if (!pr) {
      // Demo: only three full profiles exist
      $('lede').textContent = 'Full biography coming soon.';
      $('actions').innerHTML = `<a class="btn btn-gold" href="tel:1.804.747.5200">${ico('phone')} 804.747.5200</a><a class="btn btn-light" href="attorneys.html">All attorneys</a>`;
      $('bio').innerHTML = '<p>This is a demo build. Full profiles are included for the first three attorneys listed.</p>';
      document.querySelector('.profile-aside').style.display = 'none';
      setTimeout(() => H.attorneyDemo(a.slug), 400);
    } else {
      $('lede').textContent = pr.lede;
      $('actions').innerHTML = `
        <a class="btn btn-gold" href="tel:${pr.direct}">${ico('phone')} ${pr.direct}</a>
        <a class="btn btn-light" href="mailto:${pr.email}">${ico('mail')} Email</a>
        <a class="btn btn-light" href="${pr.vcard}">${ico('download')} vCard</a>
        <button class="btn btn-light" type="button" onclick="window.print()">${ico('file')} Print</button>`;

      $('contactRows').innerHTML = `
        <div class="info-row"><span><small>Direct Dial</small><a href="tel:${pr.direct}">${pr.direct}</a></span></div>
        <div class="info-row"><span><small>Email</small><a href="mailto:${pr.email}">${pr.email}</a></span></div>
        ${office ? `<div class="info-row"><span><small>${office.label}</small>${office.street}<br>${office.cityLine}</span></div>` : ''}
        ${pr.team.map((t) => `<div class="info-row"><span><small>${t.role}</small><a href="mailto:${t.email}">${t.name}</a> · <a href="tel:${t.phone}">${t.phone}</a></span></div>`).join('')}`;

      $('bio').innerHTML = pr.bio.map((p) => `<p>${p}</p>`).join('');

      const tabs = $('tabs'), panels = $('panels');
      tabs.innerHTML = pr.sections.map((s, i) => `<button role="tab" class="${i ? '' : 'active'}" data-i="${i}" aria-selected="${!i}">${s.title}</button>`).join('');
      panels.innerHTML = pr.sections.map((s, i) => `
        <div class="tab-panel ${i ? '' : 'active'}" role="tabpanel">
          <ul class="cred-list">${s.items.map((it) => `<li>${ico(s.icon)}<span>${typeof it === 'string' ? it : `<a href="${it.href}" target="_blank" rel="noopener">${it.text}</a>`}</span></li>`).join('')}</ul>
        </div>`).join('');
      tabs.addEventListener('click', (e) => {
        const b = e.target.closest('button'); if (!b) return;
        [...tabs.children].forEach((x) => { x.classList.toggle('active', x === b); x.setAttribute('aria-selected', x === b); });
        [...panels.children].forEach((p, i) => p.classList.toggle('active', i == b.dataset.i));
      });
    }

    $('areaTags').innerHTML = a.areas.length
      ? a.areas.map((s) => `<a class="tag" href="practice-area.html?area=${s}">${H.areas.find((x) => x.slug === s)?.title || s}</a>`).join('')
      : '<span style="color:var(--muted);font-size:.9rem">General civil litigation</span>';
    $('barTags').innerHTML = a.bars.map((b) => `<a class="tag" href="attorneys.html?bar=${encodeURIComponent(b)}">${b}</a>`).join('');
    if (!a.areas.length) $('areasCard').style.display = '';

    // Colleagues in the same office
    const col = H.attorneys.filter((x) => x.loc === a.loc && x.slug !== a.slug);
    const FEAT = Object.keys(H.profiles);
    const featured = FEAT.filter((s) => s !== a.slug).map((s) => H.attorneys.find((x) => x.slug === s));
    const pick = [...featured, ...col.filter((x) => !FEAT.includes(x.slug))].slice(0, 4);
    $('colEyebrow').textContent = office ? `${office.city} Office` : 'Colleagues';
    $('colTitle').textContent = 'More from our team';
    $('colLink').href = office ? `attorneys.html?location=${encodeURIComponent(office.filter)}` : 'attorneys.html';
    $('colleagues').innerHTML = pick.map((x) => H.attyCard(x)).join('');
  })();
</script>
<script src="assets/js/site.js"></script>
</body>
</html>
